# CI is the authoritative gate. Pin actions to commit SHAs if your policy requires it.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: bash scripts/verify
  # Build the release binary and smoke-test it on each OS we ship for. Offline: never calls Hinge.
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable --no-self-update
      - run: cargo build --release --locked
      - run: bash scripts/smoke
